name: build

# Regenerates the schematic and board, runs ERC and DRC, and uploads the
# manufacturing files. Nothing is committed back to the repository.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix develop -c ./scripts/build.sh
      - name: Check the committed outputs are current
        run: git diff --stat --exit-code -- hardware fab/bom.csv fab/bom-jlcpcb.csv fab/cpl-jlcpcb.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet_dmm-fab
          path: |
            fab/
            build/erc.rpt
            build/drc.rpt

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Test and build
        run: |
          nix develop .#firmware -c sh -c '
            cd firmware && cargo fmt --all --check && cargo test -p dmm-core &&
            cd app && cargo fmt --check && RUSTFLAGS="-D warnings -C link-arg=-Tlink.x" cargo build --release'
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-dmm-firmware
          path: firmware/app/target/thumbv6m-none-eabi/release/wallet-dmm
